
name: Scheduled Build & Scan (Matrix Strategy)

on:
  schedule:
    - cron: '30 19 * * *'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no updates found'
        required: false
        default: false
        type: boolean
      target_image:
        description: 'Build all images or only Nextcloud'
        required: true
        default: all
        type: choice
        options:
          - all
          - tailscale
          - crowdsec
          - socket-proxy
          - promtail
          - immich-server
          - immich-machine-learning
          - immich-redis
          - immich-postgres
          - nextcloud
          - mariadb
          - vaultwarden
          - tetragon
          - portainer
          - cryptpad
      nextcloud_min_version:
        description: 'Minimum allowed Nextcloud Docker tag (e.g. 34.0.4)'
        required: true
        default: '34.0.4'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: charlotte-de-r
  IMAGE_REPO: hardening
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Select build matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_IMAGE: ${{ inputs.target_image }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" &&
                "$TARGET_IMAGE" == "nextcloud" ]]; then
            MATRIX='{"include":[{"name":"nextcloud","context":"./dockerfiles/nextcloud","image_tag":"nextcloud:hardened"}]}'
          else
            MATRIX='{"include":[
              {"name":"tailscale","context":"./dockerfiles/tailscale","image_tag":"tailscale:hardened"},
              {"name":"crowdsec","context":"./dockerfiles/crowdsec","image_tag":"crowdsec:hardened"},
              {"name":"socket-proxy","context":"./dockerfiles/socket-proxy","image_tag":"socket-proxy:hardened"},
              {"name":"promtail","context":"./dockerfiles/promtail","image_tag":"promtail:hardened"},
              {"name":"immich-server","context":"./dockerfiles/immich-server","image_tag":"immich-server:hardened"},
              {"name":"immich-machine-learning","context":"./dockerfiles/immich-machine-learning","image_tag":"immich-machine-learning:hardened"},
              {"name":"immich-redis","context":"./dockerfiles/immich-redis","image_tag":"immich-redis:hardened"},
              {"name":"immich-postgres","context":"./dockerfiles/immich-postgres","image_tag":"immich-postgres:hardened"},
              {"name":"nextcloud","context":"./dockerfiles/nextcloud","image_tag":"nextcloud:hardened"},
              {"name":"mariadb","context":"./dockerfiles/mariadb","image_tag":"mariadb:hardened"},
              {"name":"vaultwarden","context":"./dockerfiles/vaultwarden","image_tag":"vaultwarden:hardened"},
              {"name":"tetragon","context":"./dockerfiles/tetragon","image_tag":"tetragon:hardened"},
              {"name":"portainer","context":"./dockerfiles/portainer","image_tag":"portainer:hardened"},
              {"name":"cryptpad","context":"./dockerfiles/cryptpad","image_tag":"cryptpad:hardened"}
            ]}'
          fi

          echo "matrix=$(jq -c . <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

  build-and-harden:
    needs: select-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}

    steps:
      - name: Determine Cache Strategy
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "CACHE_KEY=$RUN_ID" >> "$GITHUB_ENV"
          else
            echo "CACHE_KEY=$(date +%Y.%U)" >> "$GITHUB_ENV"
          fi

      - name: Set image full path
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${IMAGE_OWNER}/${IMAGE_REPO}/${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Make scripts executable
        run: chmod +x update_dockerfiles.sh check_update.sh

      - name: Inject Security Hardening Templates
        env:
          TARGET_CONTEXT: ${{ matrix.context }}
        run: ./update_dockerfiles.sh "$TARGET_CONTEXT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Check Updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXTCLOUD_MIN_VERSION: ${{ inputs.nextcloud_min_version || '34.0.4' }}
        run: ./check_update.sh "${{ env.FULL_IMAGE_NAME }}"

      - name: Prepare Dynamic Build Args
        if: steps.check.outputs.needs_update == 'true' || inputs.force_build == true || github.event_name == 'pull_request'
        env:
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'DYNAMIC_BUILD_ARGS<<EOF'
            echo "CACHEBUST=${{ env.CACHE_KEY }}"

            if [[ -n "$LATEST_VERSION" ]]; then
              echo "APP_VERSION=$LATEST_VERSION"
              echo "Selected APP_VERSION=$LATEST_VERSION"
            fi

            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build and Push
        id: build
        if: steps.check.outputs.needs_update == 'true' || inputs.force_build == true || github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.hardened
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.FULL_IMAGE_NAME }}
          build-args: ${{ env.DYNAMIC_BUILD_ARGS }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

      - name: Verify built Nextcloud version
        if: matrix.name == 'nextcloud' && (steps.check.outputs.needs_update == 'true' || inputs.force_build == true || github.event_name == 'pull_request')
        env:
          EXPECTED_VERSION: ${{ steps.check.outputs.latest_version }}
          IMAGE_REF: ${{ env.FULL_IMAGE_NAME }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Expected Nextcloud version is empty."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            docker pull "$IMAGE_REF"
          fi

          ACTUAL_VERSION=$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "$IMAGE_REF"
          )

          echo "Expected version: $EXPECTED_VERSION"
          echo "Actual image label: $ACTUAL_VERSION"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Version mismatch."
            exit 1
          fi

          echo "Nextcloud image label verification passed."

      - name: Sign image (cosign)
        if: (steps.check.outputs.needs_update == 'true' || inputs.force_build == true) && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE: ${{ env.FULL_IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "WARNING: Image digest not found."
            exit 0
          fi

          cosign sign --yes "$IMAGE@$DIGEST" || echo "WARNING: Image signing failed."

      - name: Verify signature
        if: (steps.check.outputs.needs_update == 'true' || inputs.force_build == true) && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          IMAGE: ${{ env.FULL_IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "WARNING: Image digest not found."
            exit 0
          fi

          cosign verify "$IMAGE@$DIGEST" || echo "WARNING: Signature verification failed."

      - name: Trivy scan
        id: trivy
        if: steps.check.outputs.needs_update == 'true' || inputs.force_build == true || github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FULL_IMAGE_NAME }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 15m
          scanners: vuln

      - name: Upload Trivy SARIF results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}
