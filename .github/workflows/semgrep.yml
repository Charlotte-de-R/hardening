name: Semgrep (report-only)

# Report-only: findings are uploaded to Code scanning as SARIF.
# This workflow never gates a build, publish, or pull request.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove any stale report
        run: rm -f semgrep.sarif

      - name: Run Semgrep (report-only)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed \
            semgrep scan \
              --config p/default \
              --config p/security-audit \
              --metrics=off \
              --sarif --output semgrep.sarif .

      - name: Warn if SARIF was not produced
        if: always() && hashFiles('semgrep.sarif') == ''
        run: echo "::warning::semgrep.sarif was not produced; check the scan step log."

      - name: Upload SARIF to Code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep