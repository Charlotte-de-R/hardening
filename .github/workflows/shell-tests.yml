name: Shell Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run shell tests
        run: |
          chmod +x check_update.sh
          ./tests/test_check_update.sh
