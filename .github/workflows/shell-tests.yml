name: Shell Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Run shell tests
        run: |
          chmod +x check_update.sh
          ./tests/test_check_update.sh
