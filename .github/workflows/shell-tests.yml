name: Shell Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shell tests
        run: |
          chmod +x check_update.sh update_dockerfiles.sh
          ./tests/test_check_update.sh
          ./tests/test_update_dockerfiles.sh
